#
# ModernFix configuration goes here,
#
# This is used to turn off ModernFix-related mixins that may cause incompatibilities with third-party mods when paired with this mod,
# this configuration should not be modified unless said mod has been patched or there is another mixin that has to be disabled.
#
# Full ModernFix mixin documentation can be discovered here:
# https://github.com/embeddedt/ModernFix/wiki/1.21.4-Summary-of-Patches
#
mixin.bugfix.missing_block_entities=true
mixin.bugfix.packet_leak=true
mixin.feature.branding=false
mixin.feature.direct_stack_trace=true
mixin.feature.measure_time=false
mixin.feature.snapshot_easter_egg=false
mixin.feature.warn_missing_perf_mods=false
mixin.perf.deduplicate_wall_shapes=false
mixin.perf.faster_texture_stitching=false
mixin.perf.resourcepacks=false
