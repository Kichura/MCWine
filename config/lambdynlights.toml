#
# Dyanmic lights configuration goes here.
#
# It is recommended you leave this mode set to fancy for best effects unless your game's framerate becomes unstable,
# or the mod ends up causing weird flickering then use fast/fastest modes instead.
#
mode = "fancy"

[light_sources]
	#
	# Prevents torches and other entities from lighting up when submerged into water sources.
	#
	water_sensitive_check = false
	#
	# Should beacons and end gateway beams light up?
	#
	beam = true
	#
	# Should entities light up?
	#
	entities = true
	#
	# If enabled, Allow dynamic lights to work whilst in first person,
	# This may cause issues with shaders so best to keep that in mind.
	#
	self = true
	#
	# If enabled, Make TNT light up during igniting effect.
	#
	tnt = "off"
	#
	# If enabled, Make creepers light up during igniting effect.
	#
	creeper = "off"
	#
	# Should guardian lasers light up?
	#
	guardian_laser = true

			[light_sources.settings.entities.minecraft]
				glow_item_frame = false
#
# Debugging configuration goes here.
#
[debug]
	active_dynamic_lighting_cells = false
	display_dynamic_lighting_chunk_rebuild = false
	display_behavior_bounding_box = false
	light_level_radius = 0
	#
	# What entities to toggle in order to be used in dynamic lights,
	# A portion of these don't need dynamic lights to be used anyways so they will be filtered.
